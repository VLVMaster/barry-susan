<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Barry &amp; Susan</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    background: #F5EFE1;
    font-family: Georgia, 'Times New Roman', serif;
    color: #2a2a26;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page {
    width: min(90vw, 700px);
    text-align: center;
    padding: 4vh 0;
  }
  h1 {
    font-weight: normal;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    margin: 0 0 2vh;
    opacity: 0.85;
  }
  img {
    max-width: 100%;
    max-height: 55vh;
    display: block;
    margin: 0 auto 3vh;
  }
  p.story {
    font-size: 1.05rem;
    line-height: 1.6;
    text-align: left;
  }
</style>
</head>
<body>
  <div class="page">
    <h1>Barry and Susan</h1>
    <img id="pic" src="today.png" alt="Barry and Susan">
    <p class="story" id="story">Loading today's nonsense…</p>
  </div>
  <script>
    const stamp = new Date().toISOString().slice(0, 10);
    document.getElementById('pic').src = 'today.png?v=' + stamp;

    fetch('today.json?v=' + stamp)
      .then(r => r.json())
      .then(data => {
        document.getElementById('story').textContent = data.story || '';
      })
      .catch(() => {
        document.getElementById('story').textContent = '';
      });
  </script>
</body>
</html>
