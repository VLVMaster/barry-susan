<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Barry &amp; Susan</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f5efe1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
</style>
</head>
<body>
  <img id="pic" src="today.png" alt="Barry and Susan">
  <script>
    // Cache-bust once a day so the Pi actually picks up the new image
    // instead of showing a browser-cached version from yesterday.
    const img = document.getElementById('pic');
    function refresh() {
      img.src = 'today.png?v=' + new Date().toISOString().slice(0, 10);
    }
    refresh();
    // Re-check every hour in case the kiosk browser is left running for days.
    setInterval(refresh, 60 * 60 * 1000);
  </script>
</body>
</html>
