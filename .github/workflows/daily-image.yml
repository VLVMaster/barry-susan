name: Generate today's Barry & Susan

on:
  schedule:
    # 06:00 UTC daily — adjust to whenever you want the day to "start"
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate today's image
        run: python generate.py

      - name: Commit and push
        run: |
          git config user.name "barry-and-susan-bot"
          git config user.email "actions@github.com"
          git add docs/today.png docs/today.json
          git diff --quiet --cached || git commit -m "Today's Barry & Susan"
          git push
